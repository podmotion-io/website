<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560">
  <!-- Background -->
  <rect width="480" height="560" rx="20" fill="#040A14"/>

  <!-- Star field -->
  <circle cx="52"  cy="38"  r="1"   fill="#B8D4F0" opacity="0.4"/>
  <circle cx="410" cy="55"  r="1.5" fill="#B8D4F0" opacity="0.3"/>
  <circle cx="430" cy="140" r="1"   fill="#B8D4F0" opacity="0.5"/>
  <circle cx="38"  cy="300" r="1.5" fill="#B8D4F0" opacity="0.35"/>
  <circle cx="455" cy="320" r="1"   fill="#B8D4F0" opacity="0.4"/>
  <circle cx="70"  cy="480" r="1"   fill="#B8D4F0" opacity="0.3"/>

  <!-- Outer ring: eternity -->
  <circle cx="240" cy="210" r="110" fill="none" stroke="#0D1F3A" stroke-width="2"/>

  <!-- Mid ring: omnipresence -->
  <circle cx="240" cy="210" r="82"  fill="none" stroke="#1A3A6E" stroke-width="2"/>

  <!-- Inner ring: quantum boundary -->
  <circle cx="240" cy="210" r="54"  fill="#040A14" stroke="#3B82F6" stroke-width="3"/>

  <!-- Core fill -->
  <circle cx="240" cy="210" r="34"  fill="#1565C0"/>

  <!-- Core glow -->
  <circle cx="240" cy="210" r="18"  fill="#22D3EE"/>

  <!-- Core center -->
  <circle cx="240" cy="210" r="7"   fill="#EEF6FF"/>

  <!-- Cardinal connectors -->
  <!-- North -->
  <line x1="240" y1="138" x2="240" y2="156" stroke="#3B82F6" stroke-width="1.5" opacity="0.7"/>
  <!-- East -->
  <line x1="312" y1="210" x2="296" y2="210" stroke="#3B82F6" stroke-width="1.5" opacity="0.7"/>
  <!-- South -->
  <line x1="240" y1="282" x2="240" y2="264" stroke="#3B82F6" stroke-width="1.5" opacity="0.7"/>
  <!-- West -->
  <line x1="168" y1="210" x2="184" y2="210" stroke="#3B82F6" stroke-width="1.5" opacity="0.7"/>

  <!-- Cardinal satellite nodes -->
  <!-- North: cy=210-82=128 -->
  <circle cx="240" cy="128" r="10" fill="#1E4A8A" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="240" cy="128" r="4"  fill="#60A5FA"/>
  <!-- East: cx=240+82=322 -->
  <circle cx="322" cy="210" r="10" fill="#1E4A8A" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="322" cy="210" r="4"  fill="#60A5FA"/>
  <!-- South: cy=210+82=292 -->
  <circle cx="240" cy="292" r="10" fill="#1E4A8A" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="240" cy="292" r="4"  fill="#60A5FA"/>
  <!-- West: cx=240-82=158 -->
  <circle cx="158" cy="210" r="10" fill="#1E4A8A" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="158" cy="210" r="4"  fill="#60A5FA"/>

  <!-- Wordmark -->
  <text text-anchor="middle" x="240" y="358" font-family="system-ui,-apple-system,sans-serif" font-size="38">
    <tspan font-weight="700" fill="#60A5FA">Pod</tspan><tspan font-weight="300" fill="#EEF6FF">Motion</tspan>
  </text>

  <!-- Tagline -->
  <text text-anchor="middle" x="240" y="390"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="13" fill="#3B82F6" letter-spacing="0.3">Kubernetes Pods Made Immortal</text>
</svg>
